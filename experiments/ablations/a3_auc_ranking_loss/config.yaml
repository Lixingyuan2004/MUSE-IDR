experiment:
  name: a3_auc_ranking_loss
  seed: 17
  formal_seeds: [17, 29, 43]
  output_dir: outputs/ablations/a3_auc_ranking_loss

model:
  pretrained_model: facebook/esm2_t33_650M_UR50D
  revision: 08e4846e537177426273712802403f7ba8261b6c
  input_size: 1280
  hidden_size: 256
  kernels: [3, 7, 15, 31]
  dropout: 0.2

training:
  epochs: 20
  patience: 4
  protein_batch_size: 4
  learning_rate: 0.0003
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  num_workers: 0
  class_balance: true

loss:
  name: weighted_bce_plus_sampled_pairwise_auc
  rank_weight: 0.2
  rank_margin: 0.0
  max_pairs_per_batch: 8192

evaluation:
  primary_metric: micro_roc_auc
  unknown_label: -1
