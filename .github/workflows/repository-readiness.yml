name: repository-readiness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-entry-points:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit GitHub and research-repository layout
        run: python scripts/audit_github_readiness.py
      - name: Compile reader-facing entry points
        run: >-
          python -m compileall -q models training inference evaluation
          scripts/audit_github_readiness.py tests/test_repository_navigation.py
